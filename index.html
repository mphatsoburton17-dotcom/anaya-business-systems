<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Anaya Business Systems</title>
    <meta name="description" content="Sales, items, customers, quotes, and reports — everything to run your business, in one app." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- PWA: manifest + theme color -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1449B0" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS-specific: Safari ignores manifest.json for "Add to Home Screen" polish,
         so these fill the gap (standalone window, no browser chrome, status bar style). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Anaya" />

    <!-- Android/Chrome PWA install prompt hint -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
